name: Android CI

on:
  push:
    branches:
      - feature/frontend-ux-and-dashboard-fixes
  pull_request:
    branches:
      - main
      - feature/frontend-ux-and-dashboard-fixes

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build Debug APK and Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          set +e
          yes | "$SDKMANAGER" --licenses
          SDK_MANAGER_EXIT=${PIPESTATUS[1]}
          set -e
          if [ "$SDK_MANAGER_EXIT" -ne 0 ]; then
            exit "$SDK_MANAGER_EXIT"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
